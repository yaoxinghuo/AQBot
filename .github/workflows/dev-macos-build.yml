name: Dev macOS Build (unsigned)

# Builds an unsigned (ad-hoc signed) AQBot.app for personal testing on forks
# where the release signing secrets are unavailable. Runs automatically on
# pushes to the fix branch and can be triggered manually.

on:
  push:
    branches:
      - 'fix/agent-stream-reply-truncation'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-macos-aarch64:
    name: Dev Build (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # actions/checkout only injects credentials for the fork itself. The
      # .gitmodules URLs use git@github.com:, so rewrite to HTTPS first; if
      # the upstream submodule repos are private, store a PAT that can read
      # them as the AQBOT_SUBMODULE_TOKEN secret on this repository.
      - name: Fetch submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.AQBOT_SUBMODULE_TOKEN }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "$SUBMODULE_TOKEN" ]; then
            git config --global http.https://github.com/.extraheader \
              "AUTHORIZATION: basic $(printf 'x:%s' "$SUBMODULE_TOKEN" | base64)"
          fi
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: 'macos-latest-aarch64-apple-darwin'
          workspaces: src-tauri -> target

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get linked dependency versions
        id: dep-versions
        run: |
          SM_SHA=$(git -C libs/stream-monaco rev-parse HEAD)
          MS_SHA=$(git -C libs/markstream-vue rev-parse HEAD)
          echo "cache-key=${{ runner.os }}-aarch64-linked-deps-${SM_SHA:0:12}-${MS_SHA:0:12}" >> $GITHUB_OUTPUT

      - name: Cache linked dependencies
        id: cache-linked-deps
        uses: actions/cache@v4
        with:
          path: |
            libs/stream-monaco/node_modules
            libs/stream-monaco/dist
            libs/markstream-vue/node_modules
            libs/markstream-vue/packages/markdown-parser/node_modules
            libs/markstream-vue/packages/markdown-parser/dist
            libs/markstream-vue/packages/markstream-react/node_modules
            libs/markstream-vue/packages/markstream-react/dist
          key: ${{ steps.dep-versions.outputs.cache-key }}

      - name: Build linked dependencies
        if: steps.cache-linked-deps.outputs.cache-hit != 'true'
        run: |
          pnpm --dir libs/stream-monaco install --frozen-lockfile
          pnpm --dir libs/stream-monaco build

          pnpm --dir libs/markstream-vue install --frozen-lockfile
          pnpm --dir libs/markstream-vue run build:parser
          pnpm --dir libs/markstream-vue/packages/markstream-react build

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # pnpm tauri is scripts/tauri-cli.mjs: without TAURI_SIGNING_PRIVATE_KEY
      # it already appends --config '{"bundle":{"createUpdaterArtifacts":false}}',
      # so no signing secret is required here.
      - name: Build AQBot.app
        # --target is required so artifacts land under target/<triple>/release
        run: pnpm tauri build --bundles app --target aarch64-apple-darwin
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      # Apple Silicon refuses to run unsigned binaries; ensure at least an
      # ad-hoc signature exists (tauri-bundler already applies one, this is a
      # safety net), then verify the bundle is executable.
      - name: Ad-hoc sign and verify
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/AQBot.app"
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH" || true
          codesign --verify --verbose=2 "$APP_PATH"

      - name: Package .app as zip
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/AQBot.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "AQBot-dev-${{ github.sha }}.zip"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqbot-dev-macos-arm64
          path: "AQBot-dev-${{ github.sha }}.zip"
          if-no-files-found: error
          retention-days: 14
